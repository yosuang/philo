# Local phase-1 stack. The database password is a local default only.
# Do not reuse it, and do not put provider keys in this file.
# Pass PHILO_PROVIDER_API_KEY from the shell when you really want provider mode.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: philo
      POSTGRES_PASSWORD: philo
      POSTGRES_DB: philo
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U philo -d philo"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - philo-pg:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PHILO_DATABASE_URL: postgres://philo:philo@postgres:5432/philo?sslmode=disable
      PHILO_HTTP_ADDR: ":8080"
      PHILO_MODEL_ADAPTER: ${PHILO_MODEL_ADAPTER:-}
      PHILO_EXECUTION_FIXTURE: ${PHILO_EXECUTION_FIXTURE:-}
      PHILO_AUTH_CREDENTIALS: ${PHILO_AUTH_CREDENTIALS:-}
      PHILO_PROVIDER_API_KEY: ${PHILO_PROVIDER_API_KEY:-}
      PHILO_PROVIDER_BASE_URL: ${PHILO_PROVIDER_BASE_URL:-https://api.openai.com/v1}
      PHILO_MAKEZ_URL: ${PHILO_MAKEZ_URL:-}
      PHILO_DEV_CHUNK_DELAY: ${PHILO_DEV_CHUNK_DELAY:-40ms}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  philo-pg:
